<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>
    <div class="container">
        <h1>
            BMI Calculator
        </h1>

        <form >
            <input type="text" placeholder="Enter Height" id = "height" style = "background-color : orange; color : #212121
            ">
            <input type="text" placeholder="Enter Weight" id = "weight" style = "background-color : orange; color : #212121
            ">
            <Button id="Calculate" style = "background-color : Red; color : #fff">Calculate</Button>
            <div id="result" style = "background-color : Red; color : #fff"></div>
        </form>
        <H2>BMI Weight guide</H2>
        <H3>Under Weigth : Less than 18.6</H3>
        <H3>Normal Weight : Between 18.6 and 24.8</H3>
        <H3>Over Weigth : More than 24.8</H3>
    </div>
</body>
<style>
    body{
        background-color: black;
        color: aliceblue;
    }
</style>
<script src="Script.js"></script>
</html>
